name: Build Misaki iOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Run emulator unit tests on iOS Simulator
        shell: bash
        run: |
          set -euo pipefail
          SIMULATOR_ID="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          matches = [d["udid"] for runtime, items in devices.items() if "iOS" in runtime for d in items if d.get("isAvailable", True) and "iPhone" in d.get("name", "")]
          if not matches:
              sys.exit("No available iPhone simulator")
          print(matches[0])
          ')"
          xcodebuild -project Misaki.xcodeproj -scheme Misaki -configuration Debug -destination "platform=iOS Simulator,id=$SIMULATOR_ID" CODE_SIGNING_ALLOWED=NO test
      - name: Build for iOS Simulator
        run: xcodebuild -project Misaki.xcodeproj -scheme Misaki -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Build unsigned iOS app
        run: xcodebuild -project Misaki.xcodeproj -scheme Misaki -configuration Debug -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/MisakiDerivedData" CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/MisakiDerivedData/Build/Products/Debug-iphoneos/Misaki.app"
          test -d "$APP"
          mkdir -p "$RUNNER_TEMP/MisakiIPA/Payload"
          ditto "$APP" "$RUNNER_TEMP/MisakiIPA/Payload/Misaki.app"
          cd "$RUNNER_TEMP/MisakiIPA"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/Misaki-unsigned.ipa" Payload
          /usr/bin/unzip -l "$GITHUB_WORKSPACE/Misaki-unsigned.ipa" | grep 'Payload/Misaki.app/'
      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Misaki-unsigned-IPA
          path: Misaki-unsigned.ipa
          if-no-files-found: error
